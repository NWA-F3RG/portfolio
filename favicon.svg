<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="16" fill="#1a1a1c"/>

  <!-- Terminal window chrome -->
  <rect x="8" y="8" width="84" height="84" rx="6" fill="#232325" stroke="#3e3d32" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect x="8" y="8" width="84" height="18" rx="6" fill="#2a2a2c"/>
  <rect x="8" y="20" width="84" height="6" fill="#2a2a2c"/>

  <!-- Window dots -->
  <circle cx="20" cy="17" r="3" fill="#f92672"/>
  <circle cx="30" cy="17" r="3" fill="#fd971f"/>
  <circle cx="40" cy="17" r="3" fill="#a6e22e"/>

  <!-- Prompt $ -->
  <text x="16" y="46" font-family="monospace" font-size="15" font-weight="bold" fill="#a6e22e">$</text>

  <!-- Cursor block -->
  <rect x="28" y="34" width="9" height="13" fill="#f92672" opacity="0.85"/>

  <!-- Code lines -->
  <line x1="16" y1="60" x2="72" y2="60" stroke="#75715e" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="71" x2="58" y2="71" stroke="#75715e" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="82" x2="66" y2="82" stroke="#3e3d32" stroke-width="2" stroke-linecap="round"/>
</svg>
