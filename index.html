<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #1a1a1c;
    --bg-deep:   #0f0f10;
    --bg-soft:   #232325;
    --bg-elev:   #2a2a2c;
    --fg:        #e6e6dc;
    --fg-dim:    #75715e;
    --green:     #a6e22e;
    --orange:    #fd971f;
    --cyan:      #66d9ef;
    --pink:      #f92672;
    --yellow:    #e6db74;
    --purple:    #ae81ff;
    --border:    #3e3d32;
    --border-active: #75715e;
    --font: 'IBM Plex Mono', 'JetBrains Mono', 'Cascadia Mono', monospace;
  }

  html, body {
    background: var(--bg-deep);
    color: var(--fg);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.55;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    scroll-padding-bottom: 70px;
  }

  /* Scanlines — restrained ~3% */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 2px,
      rgba(0,0,0,0.04) 2px,
      rgba(0,0,0,0.04) 3px
    );
    pointer-events: none;
    z-index: 9999;
    mix-blend-mode: multiply;
  }

  /* =================================================================
     BOOT SCREEN
     ================================================================= */
  .boot {
    padding: 24px 32px 24px 32px;
    background: var(--bg-deep);
    min-height: 100vh;
    min-height: 100dvh;
    font-size: 13.5px;
    line-height: 1.45;
  }

  .boot-line {
    white-space: pre;
    margin-bottom: 1px;
    color: var(--fg);
  }

  .boot-line.empty { height: 1.45em; }
  .boot-line.motd-body-wrap { white-space: pre-wrap; word-wrap: break-word; }

  .ts      { color: var(--fg-dim); }
  .ok      { color: var(--green); }
  .fail    { color: var(--pink); }
  .warn    { color: var(--yellow); }
  .info    { color: var(--cyan); }
  .hl      { color: var(--orange); }
  .dim     { color: var(--fg-dim); }
  .bracket { color: var(--fg); }

  /* =================================================================
     NEOFETCH
     ================================================================= */
  .neofetch {
    display: flex;
    gap: 32px;
    margin: 16px 0 8px 0;
    font-size: 13px;
    line-height: 1.45;
  }

  .neofetch-art {
    color: var(--orange);
    white-space: pre;
    flex-shrink: 0;
    font-size: 12px;
    line-height: 1.2;
  }

  .neofetch-info { flex: 1; min-width: 0; }

  .neofetch-info .head { color: var(--green); margin-bottom: 2px; }
  .neofetch-info .head .at   { color: var(--fg); }
  .neofetch-info .head .host { color: var(--cyan); }
  .neofetch-info .sep  { color: var(--fg-dim); margin-bottom: 4px; }

  .neofetch-info .row { display: flex; gap: 8px; }
  .neofetch-info .row .k { color: var(--green); min-width: 88px; }
  .neofetch-info .row .v { color: var(--fg); }
  .neofetch-info .row .v .hl    { color: var(--cyan); }
  .neofetch-info .row .v .meter { color: var(--orange); }

  .neofetch-colors { margin-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .neofetch-colors .strip { display: flex; }
  .neofetch-colors .sw { width: 18px; height: 12px; }

  /* =================================================================
     PROMPT + INPUT
     ================================================================= */
  .prompt-line {
    display: flex;
    align-items: baseline;
    gap: 0;
    font-size: 14px;
    margin: 8px 0 4px 0;
    position: sticky;
    bottom: 52px;
    background: var(--bg-deep);
    z-index: 50;
    padding: 4px 0;
  }

  .p-user   { color: var(--green); }
  .p-at     { color: var(--fg); }
  .p-host   { color: var(--cyan); }
  .p-colon  { color: var(--fg); }
  .p-path   { color: var(--orange); }
  .p-branch { color: var(--purple); font-style: italic; margin-left: 8px; }
  .p-sigil  { color: var(--fg); margin: 0 6px 0 8px; }

  .prompt-input {
    background: transparent;
    border: none;
    outline: none !important;
    color: var(--fg);
    font-family: inherit;
    font-size: inherit;
    flex: 1;
    caret-color: transparent;
    padding: 0;
    position: relative;
    z-index: 1;
  }

  .prompt-input::placeholder { color: var(--fg-dim); font-style: italic; }

  .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--green);
    vertical-align: text-bottom;
    margin-left: -0.55em;
    animation: blink 1.1s step-end infinite;
    pointer-events: none;
    position: relative;
  }

  /* Wrapper lets the cursor be positioned exactly at the text insertion point */
  .prompt-cursor-wrap {
    position: relative;
    flex: 1;
    display: flex;
    align-items: baseline;
  }

  .cursor.input-cursor {
    position: absolute;
    bottom: 0;
    left: 0;        /* JS updates this to match typed text width */
    margin-left: 0;
    pointer-events: none;
    z-index: 2;
  }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes bootSlideUp {
    from { transform: translateY(0); }
    to   { transform: translateY(-100%); }
  }
  .boot-exiting {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 10;
    animation: bootSlideUp 420ms cubic-bezier(0.7, 0, 1, 1) forwards;
    will-change: transform;
  }
  /* Standalone blinking cursor that appears when shell claims the TTY */
  .shell-drop-cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--green);
    vertical-align: text-bottom;
    animation: blink 1.1s step-end infinite;
  }

  .type-cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--green);
    vertical-align: text-bottom;
    margin-left: 1px;
    animation: blink 1.1s step-end infinite;
    pointer-events: none;
  }

  /* =================================================================
     COMMAND OUTPUT
     ================================================================= */
  .output {
    margin: 4px 0 12px 0;
    color: var(--fg);
    font-size: 13.5px;
    line-height: 1.6;
    white-space: pre-wrap;
  }

  .output .heading { color: var(--green); font-weight: 600; }
  .output .sub     { color: var(--fg-dim); }
  .output .hl      { color: var(--cyan); }
  .output .accent  { color: var(--orange); }
  .output .warn    { color: var(--yellow); }
  .output .fail    { color: var(--pink); }
  .output .ok      { color: var(--green); }

  .output a {
    color: var(--cyan);
    text-decoration: underline;
    text-decoration-color: var(--border);
    text-underline-offset: 3px;
    transition: text-decoration-color 0.15s;
  }
  .output a:hover { text-decoration-color: var(--cyan); }

  /* systemctl-style row */
  .sc-row {
    display: grid;
    grid-template-columns: 18px 1fr auto auto;
    gap: 14px;
    padding: 2px 0;
    cursor: pointer;
    transition: background 0.12s;
    margin: 0 -4px;
    padding-left: 4px;
    padding-right: 4px;
  }
  .sc-row:hover { background: var(--bg-soft); }
  .sc-row .dot   { }
  .sc-row .dot.g { color: var(--green); }
  .sc-row .dot.y { color: var(--yellow); }
  .sc-row .dot.d { color: var(--fg-dim); }
  .sc-row .dot.c { color: var(--cyan); }
  .sc-row .name  { color: var(--fg); }
  .sc-row .state { font-size: 11.5px; color: var(--fg-dim); }
  .sc-row .state.a { color: var(--green); }
  .sc-row .state.w { color: var(--yellow); }
  .sc-row .when  { font-size: 11.5px; color: var(--fg-dim); }

  /* tree */
  .tree { font-size: 13px; line-height: 1.65; }
  .tree .branch { color: var(--fg-dim); }
  .tree .dir    { color: var(--cyan); font-weight: 500; }
  .tree .file   { color: var(--fg); }

  /* dig */
  .dig-row { display: grid; grid-template-columns: 100px 1fr; gap: 16px; padding: 2px 0; }
  .dig-row .k { color: var(--green); }
  .dig-row .v { color: var(--fg); }
  .dig-row .v a { color: var(--cyan); }

  /* =================================================================
     COMMAND PALETTE — pinned bottom
     ================================================================= */
  .palette {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    border-top: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    z-index: 100;
    background: rgba(15, 15, 16, 0.95);
    backdrop-filter: blur(8px);
  }

  .palette-label {
    font-size: 10px;
    color: var(--fg-dim);
    letter-spacing: 0.1em;
    margin-right: 8px;
    text-transform: uppercase;
  }

  .chip {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg);
    padding: 5px 11px;
    font-family: var(--font);
    font-size: 12px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.12s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .chip:hover { border-color: var(--green); color: var(--green); background: rgba(166,226,46,0.05); }
  .chip:active { transform: scale(0.97); }
  .chip .key  { color: var(--orange); font-weight: 600; }
  .chip.icon  { margin-left: auto; }
  .chip-desc  { color: var(--fg-dim); font-size: 11px; }

  /* =================================================================
     GUI SECTIONS
     ================================================================= */
  .gui-section {
    margin: 32px 0;
    padding: 20px 24px;
    border-left: 2px solid var(--border);
    background: var(--bg-soft);
  }
  .gui-section h2 { color: var(--green); font-size: 18px; font-weight: 600; margin-bottom: 12px; }
  .gui-section h3 { color: var(--cyan); font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
  .gui-section p  { color: var(--fg); line-height: 1.7; margin-bottom: 10px; }
  .gui-section ul { list-style: none; }
  .gui-section li { color: var(--fg); padding: 4px 0; line-height: 1.6; }
  .gui-section li::before { content: '▸ '; color: var(--green); }

  /* =================================================================
     BOOT CHOOSER
     ================================================================= */
  .boot-chooser {
    padding: 8px 0;
    line-height: 1.7;
  }
  .boot-chooser .chooser-head {
    color: var(--green);
    margin-bottom: 12px;
  }
  .boot-chooser .chooser-opt {
    color: var(--fg);
    margin-left: 2ch;
    padding: 4px 6px 4px 0;
    cursor: pointer;
    border-radius: 2px;
    transition: color 0.1s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .boot-chooser .chooser-opt:active {
    color: var(--green);
  }
  .boot-chooser .chooser-opt:active .chooser-key {
    border-color: var(--green);
    color: var(--green);
  }
  @media (hover: hover) {
    .boot-chooser .chooser-opt:hover {
      color: var(--green);
    }
    .boot-chooser .chooser-opt:hover .chooser-key {
      border-color: var(--green);
      color: var(--green);
    }
  }
  .boot-chooser .chooser-key {
    color: var(--orange);
    border: 1px solid var(--border-active);
    padding: 1px 6px;
    border-radius: 2px;
    margin-right: 10px;
    font-size: 0.9em;
    display: inline-block;
    min-width: 5ch;
    text-align: center;
    transition: border-color 0.1s ease, color 0.1s ease;
  }
  .boot-chooser .chooser-prompt {
    margin-top: 8px;
    color: var(--fg);
  }
  .boot-chooser .prompt-hint {
    color: var(--fg-dim);
    font-style: italic;
    margin-right: 4px;
    margin-left: 6px;
  }
  .boot-chooser .chooser-prompt .cursor {
    margin-left: 4px;
  }

  /* =================================================================
     MUTE
     ================================================================= */
  .mute-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-dim);
    width: 28px;
    height: 28px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.12s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .mute-btn:hover { border-color: var(--border-active); color: var(--fg); }

  /* =================================================================
     APP — hidden until boot completes
     ================================================================= */
  .app {
    display: none;
    padding: 20px 32px 100px 32px;
    min-height: 100vh;
  }
  .boot.fading { opacity: 0; transition: opacity 1.2s ease-out; }
  .app.visible { display: block; opacity: 0; animation: fadeInSlow 0.35s ease-in 0.15s forwards; }
  @keyframes fadeInSlow { from { opacity: 0; } to { opacity: 1; } }

  /* Mobile — 700px */
  @media (max-width: 700px) {
    html, body { overflow-x: hidden; }
    .boot { padding: 16px 14px 16px 14px; font-size: 12px; }
    .app  { padding: 16px 14px 150px 14px; font-size: 12px; }
    /* Boot lines and output: pre-wrap so long lines wrap instead of overflow */
    .boot-line { white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; }
    .output { overflow-wrap: break-word; word-break: break-word; }
    .neofetch { flex-direction: column; gap: 10px; }
    .neofetch-art { font-size: 9px; line-height: 1.15; }
    .neofetch-info { font-size: 12px; }
    .neofetch-info .row .k { min-width: 64px; }
    .neofetch-info .row .v { word-break: break-word; }
    .sc-row { grid-template-columns: 16px 1fr; gap: 8px; }
    .sc-row .state, .sc-row .when { display: none; }
    .palette { padding: 8px 10px; gap: 4px; }
    .palette-label { display: none; }
    .chip { padding: 4px 9px; font-size: 11px; }
    .chip.icon { margin-left: 0; }
    .prompt-line { font-size: 13px; bottom: 40px; }
    .output { font-size: 12px; }
    /* Prevent iOS Safari auto-zoom (triggers on any input < 16px) */
    .prompt-input, .ssh-field { font-size: 16px; }
  }

  /* Very small screens — 420px */
  @media (max-width: 420px) {
    .boot { padding: 12px 12px 12px 12px; font-size: 11px; }
    .app  { padding: 12px 12px 160px 12px; font-size: 11px; }
    .ts { display: none; }        /* hide [timestamp] prefixes — too wide */
    .neofetch-art { display: none; } /* ASCII art not readable at this size */
    .chip { padding: 3px 7px; font-size: 10.5px; }
    .chip-desc { display: none; }
  }

  /* ssh form fields — shared base styles extracted from inline JS strings */
  .ssh-field {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg);
    font-family: var(--font);
    outline: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor, .app.visible, .boot-exiting { animation: none; opacity: 1; }
    .boot.fading { transition: none; }
  }

  *:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  *:focus:not(:focus-visible) { outline: none; }

  /* Large desktop — prevent ultrawide horizontal stretch */
  @media (min-width: 1400px) {
    .boot, .app {
      padding-left: min(160px, 12vw);
      padding-right: min(160px, 12vw);
    }
  }

  /* Large desktop — bump font size for 27"+ monitors */
  @media (min-width: 1440px) {
    html, body { font-size: 15px; }
    .boot { font-size: 14.5px; }
    .app  { font-size: 15px; }
  }

  /* Landscape mobile — rotated phones (~360-430px tall) */
  @media (orientation: landscape) and (max-height: 500px) {
    .boot  { padding: 10px 16px; font-size: 11px; }
    .app   { padding: 10px 16px 110px 16px; font-size: 11px; }
    .palette { padding: 4px 10px; gap: 3px; }
    .palette-label { display: none; }
    .chip  { padding: 3px 8px; font-size: 10px; }
    .chip-desc { display: none; }
    .chip.icon { margin-left: 0; }
    .prompt-line { bottom: 36px; font-size: 12px; }
    .neofetch { flex-direction: row; gap: 12px; }
    .neofetch-art { display: none; }
  }

  /* Very small phones — iPhone SE (375px), Galaxy A01 (360px) */
  @media (max-width: 380px) {
    .boot { padding: 10px 10px; font-size: 10.5px; }
    .app  { padding: 10px 10px 160px 10px; font-size: 10.5px; }
    .chip { padding: 2px 6px; font-size: 10px; }
    .neofetch-info { font-size: 11px; }
  }
</style>
</head>
<body>

<!-- Boot screen -->
<div class="boot" id="boot">
  <div id="boot-output"></div>
</div>

<!-- App shell -->
<div class="app" id="app">
  <div id="app-output"></div>

  <div class="prompt-line" id="active-prompt">
    <span class="p-user">nate</span><span class="p-at">@</span><span class="p-host">seggsy</span><span class="p-colon">:</span><span class="p-path" id="cwd">~</span><span class="p-branch">(main)</span><span class="p-sigil">$</span>
    <span class="prompt-cursor-wrap">
      <input
        type="text"
        class="prompt-input"
        id="prompt-input"
        placeholder="type ? for a list of commands, or click one below ↓"
        autocomplete="off"
        spellcheck="false"
      />
      <span class="cursor input-cursor" id="input-cursor"></span>
    </span>
  </div>
</div>

<!-- Command palette -->
<div class="palette" id="palette" style="display:none;">
  <span class="palette-label">// click or type</span>
  <button class="chip" data-cmd="me"><span class="key">me</span><span class="chip-desc"> — bio</span></button>
  <button class="chip" data-cmd="motd"><span class="key">motd</span><span class="chip-desc"> — ethos</span></button>
  <button class="chip" data-cmd="ls"><span class="key">ls</span><span class="chip-desc"> — projects</span></button>
  <button class="chip" data-cmd="cat resume"><span class="key">cat resume</span></button>
  <button class="chip" data-cmd="cat homelab-highlights"><span class="key">homelab</span><span class="chip-desc"> — logs</span></button>
  <button class="chip" data-cmd="cat work-highlights"><span class="key">work</span><span class="chip-desc"> — examples</span></button>
  <button class="chip" data-cmd="dig"><span class="key">dig</span><span class="chip-desc"> — contact</span></button>
  <button class="chip" data-cmd="ssh"><span class="key">ssh</span><span class="chip-desc"> — msg</span></button>
  <button class="chip" data-cmd="gui"><span class="key">gui</span><span class="chip-desc"> — readable</span></button>
  <button class="chip" data-cmd="reboot"><span class="key">reboot</span></button>
  <button class="chip" data-cmd="clear"><span class="key">clr</span></button>
  <button class="chip" data-cmd="?"><span class="key">?</span><span class="chip-desc"> — help</span></button>
  <button class="mute-btn icon" id="mute-btn" title="Toggle sound">🔊</button>
</div>

<script>
// =================================================================
// STATE
// =================================================================
let muted = false;
let bootTimeouts = [];
let history = [];
let historyIdx = -1;

const BOOT_KEY  = 'seggsy:bootSeen:v1';
const MUTE_KEY  = 'seggsy:muted:v1';

try {
  if (localStorage.getItem(MUTE_KEY) === '1') {
    muted = true;
    document.getElementById('mute-btn').textContent = '🔇';
  }
} catch(e) {}

// =================================================================
// AUDIO — Web Audio API, no assets
// =================================================================
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function keyClack() {
  if (muted) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'square';
  osc.frequency.value = 1200 + Math.random() * 400;
  g.gain.setValueAtTime(0.04, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.03);
  osc.connect(g).connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.03);
}

function failBeep() {
  if (muted) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'sine'; osc.frequency.value = 220;
  g.gain.setValueAtTime(0.06, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
  osc.connect(g).connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.15);
}

function bootBeep() {
  if (muted) return;
  const ctx = ensureAudio(); if (!ctx) return;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'sine'; osc.frequency.value = 660;
  g.gain.setValueAtTime(0.05, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
  osc.connect(g).connect(ctx.destination);
  osc.start(); osc.stop(ctx.currentTime + 0.08);
}

});

  return base + (Math.random() * 2 - 1) * range;
}

function startBoot() {
  document.getElementById('boot').style.display = 'block';
  document.getElementById('app').classList.remove('visible');
  document.getElementById('boot-output').innerHTML = '';
  document.getElementById('palette').style.display = 'none';

  bootTimeouts.push(setTimeout(bootBeep, 100));

  BOOT_LINES.forEach(function(line) {
    var t = setTimeout(function() {
      if (line.svc !== undefined) {
        var bracket, label;
        if (line.state === 'ok') {
          bracket = '<span class="bracket">[</span>  <span class="ok">OK</span>  <span class="bracket">]</span>';
          label = line.isTarget ? 'Reached target' : (line.isMount ? 'Mounted' : 'Started');
        } else {
          bracket = '<span class="bracket">[</span> <span class="fail">FAIL</span> <span class="bracket">]</span>';
          label = 'Failed to start';
          if (line.beep) failBeep();
        }
        var cls = line.state === 'fail' ? 'dim' : 'info';
        emitBootLine(bracket + ' ' + label + ' <span class="' + cls + '">' + line.svc + '</span>.');
        return;
      }
      if (line.motd) {
        var motdOut = document.getElementById('boot-output');
        var motdDiv = document.createElement('div');
        motdDiv.className = 'boot-line';
        motdDiv.id = 'boot-motd-anchor';
        motdDiv.innerHTML = renderMotd();
        motdOut.appendChild(motdDiv);
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
        return;
      }
      if (line.motdRule) {
        var rDiv = document.createElement('div');
        rDiv.className = 'boot-line';
        if (!document.getElementById('boot-motd-anchor')) {
          rDiv.id = 'boot-motd-anchor';
        }
        rDiv.innerHTML = '<span class="dim">─────────────────────────────────────────────────────────────────────────</span>';
        document.getElementById('boot-output').appendChild(rDiv);
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
        return;
      }
      if (line.motdBody) {
        var charMs = line.charInterval;
        var pauseMs = line.periodPause;
        var bDiv = document.createElement('div');
        bDiv.className = 'boot-line motd-body-wrap';
        bDiv.innerHTML = '  <span class="dim" id="motd-body-text"></span><span class="type-cursor" id="motd-body-cursor"></span>';
        document.getElementById('boot-output').appendChild(bDiv);
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
        var chars = line.text.split('');
        var elapsed = 0;
        var lastIdx = chars.length - 1;
        chars.forEach(function(ch, ci) {
          elapsed += typeJitter(charMs, charMs * 0.4);
          if (ch === ',') elapsed += 140;
          (function(t, c, isLast) {
            bootTimeouts.push(setTimeout(function() {
              var el = document.getElementById('motd-body-text');
              if (el) {
                el.textContent += c;
                keyClack();
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
              }
              if (isLast) {
                var cur = document.getElementById('motd-body-cursor');
                if (cur && cur.parentNode) cur.parentNode.removeChild(cur);
              }
            }, t));
          })(elapsed, ch, ci === lastIdx);
          if (ch === '.' && (ci === chars.length - 1 || chars[ci + 1] === ' ')) {
            elapsed += pauseMs;
          }
        });
        return;
      }
      if (line.motdTagline) {
        var tDiv = document.createElement('div');
        tDiv.className = 'boot-line';
        tDiv.innerHTML = '  <span class="hl motd-tl-hl"></span><span class="motd-tl-rest"></span><span class="dim motd-tl-dots"></span><span class="type-cursor motd-tl-cursor"></span>';
        document.getElementById('boot-output').appendChild(tDiv);
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
        var hlTarget = tDiv.querySelector('.motd-tl-hl');
        var restTarget = tDiv.querySelector('.motd-tl-rest');
        var dotsTarget = tDiv.querySelector('.motd-tl-dots');
        var cursorEl = tDiv.querySelector('.motd-tl-cursor');
        var hlChars = line.hl.split('');
        var restChars = line.rest.split('');
        var allChars = hlChars.concat(restChars);
        var avgInterval = line.typeDur / allChars.length;
        var jitterRange = avgInterval * 0.35;
        var elapsed = 0;
        hlChars.forEach(function(ch) {
          elapsed += typeJitter(avgInterval, jitterRange);
          (function(t, c) {
            bootTimeouts.push(setTimeout(function() {
              hlTarget.textContent += c;
              keyClack();
              window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
            }, t));
          })(elapsed, ch);
        });
        var lastRestIdx = restChars.length - 1;
        var keepCursor = !!line.keepCursor;
        restChars.forEach(function(ch, i) {
          elapsed += typeJitter(avgInterval, jitterRange);
          if (ch === ',') elapsed += 140;
          (function(t, c, isLast) {
            bootTimeouts.push(setTimeout(function() {
              restTarget.textContent += c;
              keyClack();
              window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
              if (isLast && !keepCursor && cursorEl && cursorEl.parentNode) {
                cursorEl.parentNode.removeChild(cursorEl);
              }
            }, t));
          })(elapsed, ch, i === lastRestIdx);
        });
        var dotStart = elapsed + line.dotPause;
        for (var d = 0; d < line.dotCount; d++) {
          (function(idx) {
            bootTimeouts.push(setTimeout(function() {
              dotsTarget.textContent += '.';
              keyClack();
            }, dotStart + idx * line.dotInterval));
          })(d);
        }
        return;
      }
      if (line.neofetch) {
        var nfOut = document.getElementById('boot-output');
        var nfDiv = document.createElement('div');
        nfDiv.className = 'boot-line';
        nfDiv.id = 'boot-neofetch-anchor';
        nfDiv.innerHTML = neofetchHtml();
        nfOut.appendChild(nfDiv);
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
        return;
      }
      if (line.projectList) {
        emitBootLine(renderProjectList());
        return;
      }
      if (line.prompt) {
        emitBootLine(renderPromptLine(line.cmd));
        return;
      }
      if (line.dropToShell) {
        completeBoot();
        return;
      }
      if (line.typed !== undefined) {
        var lineEl = document.createElement('div');
        lineEl.className = 'boot-line';
        lineEl.innerHTML = '<span class="' + (line.c || 'fg') + '">' + line.t + '</span><span class="typed-target"></span>';
        document.getElementById('boot-output').appendChild(lineEl);
        var target = lineEl.querySelector('.typed-target');
        var chars = line.typed.split('');
        var interval = line.typeDur / chars.length;
        chars.forEach(function(ch, i) {
          bootTimeouts.push(setTimeout(function() {
            target.textContent += ch;
            if (line.clack !== false) keyClack();
          }, i * interval));
        });
        return;
      }
      var tsHtml = line.ts ? '<span class="ts">' + line.ts + '</span>' : '';
      emitBootLine(tsHtml + '<span class="' + (line.c || 'fg') + '">' + line.t + '</span>');
    }, line.d);
    bootTimeouts.push(t);
  });
}

function completeBoot() {
  try { localStorage.setItem(BOOT_KEY, '1'); } catch(e) {}

  document.getElementById('app-output').innerHTML =
    '<div class="boot-line">' + renderPromptLine('cat /etc/motd') + '</div>' +
    renderMotd();

  var boot    = document.getElementById('boot');
  var bootOut = document.getElementById('boot-output');
  var app     = document.getElementById('app');

  function revealApp() {
    document.getElementById('palette').style.display = 'flex';
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        document.getElementById('prompt-input').focus();
      });
    });
  }

  // Reduced-motion: instant swap, no animation
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    boot.style.display = 'none';
    app.classList.add('visible');
    revealApp();
    return;
  }

  // --- Theatrical shell-drop sequence ---
  //
  // Phase 1 (400ms pause): silence after the boot sequence ends — the weight
  // of the system finishing its work before handing off to the user.
  //
  // Phase 2 (850ms cursor): a standalone blinking prompt cursor appears.
  // This is the TTY being claimed by the shell — the moment the system
  // transitions from init-land to user-land. Nothing happens yet.
  //
  // Phase 3 (3 × 110ms): PAM/logind auth lines bleed through, exactly as
  // they do on a real Linux login. The system acknowledging the session.
  //
  // Phase 4: green phosphor bloom fades in and out over the transition —
  // the CRT tube getting new content. Boot slides up, app fades in beneath.

  var PAM_LINES = [
    { ts: '[38.011234]', c: 'dim',  t: ' pam_unix(login:session): session opened for user nate (uid=0 by LOGIN(uid=0))' },
    { ts: '[38.014891]', c: 'info', t: ' systemd-logind[1]: New session 1 of user nate.' },
    { ts: '[38.017443]', c: 'fg',   t: ' systemd[1]: Started session-1.scope - Session 1 of User nate.' },
  ];

  // Phase 1: pause
  bootTimeouts.push(setTimeout(function() {

    // Phase 2: shell claims the TTY — standalone blinking cursor
    var cursorLine = document.createElement('div');
    cursorLine.className = 'boot-line';
    cursorLine.innerHTML = renderPromptLine('') + '<span class="shell-drop-cursor"></span>';
    bootOut.appendChild(cursorLine);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });

    // Phase 3: PAM/logind messages bleed through
    bootTimeouts.push(setTimeout(function() {
      PAM_LINES.forEach(function(line, i) {
        bootTimeouts.push(setTimeout(function() {
          var div = document.createElement('div');
          div.className = 'boot-line';
          div.innerHTML = '<span class="ts">' + line.ts + '</span>'
                        + '<span class="' + line.c + '">' + line.t + '</span>';
          bootOut.appendChild(div);
          window.scrollTo({ top: document.body.scrollHeight, behavior: 'instant' });
        }, i * 110));
      });

      // Phase 4: phosphor bloom + slide
      bootTimeouts.push(setTimeout(function() {
        // Green phosphor bloom — CRT getting new content
        var flash = document.createElement('div');
        flash.style.cssText = 'position:fixed;inset:0;z-index:15;background:rgba(166,226,46,0.10);'
                            + 'pointer-events:none;transition:opacity 500ms ease';
        document.body.appendChild(flash);
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            flash.style.opacity = '0';
            setTimeout(function() { if (flash.parentNode) flash.parentNode.removeChild(flash); }, 550);
          });
        });

        // Freeze cursor blink so it doesn't flicker mid-slide
        var dropCursor = bootOut.querySelector('.shell-drop-cursor');
        if (dropCursor) dropCursor.style.animation = 'none';

        window.scrollTo(0, 0);
        app.classList.add('visible');
        boot.classList.add('boot-exiting');

        bootTimeouts.push(setTimeout(function() {
          boot.style.display = 'none';
          boot.classList.remove('boot-exiting');
          revealApp();
        }, 460));

      }, PAM_LINES.length * 110 + 220)); // last PAM line + brief pause
    }, 850)); // cursor sits for ~850ms — deliberate, weighted
  }, 400)); // silence after boot ends
}

function skipBoot() {
  bootTimeouts.forEach(function(t) { clearTimeout(t); });
  bootTimeouts = [];
  var appOut = document.getElementById('app-output');
  appOut.innerHTML =
    '<div class="boot-line">' + renderPromptLine('cat /etc/motd') + '</div>' +
    renderMotd() +
    '<div class="boot-line">' + renderPromptLine('neofetch') + '</div>' +
    neofetchHtml() +
    '<div class="boot-line">' + renderPromptLine('ls projects/') + '</div>' +
    renderProjectList();
  document.getElementById('boot').style.display = 'none';
  window.scrollTo(0, 0);
  document.getElementById('app').classList.add('visible');
  document.getElementById('palette').style.display = 'flex';
  try { localStorage.setItem(BOOT_KEY, '1'); } catch(e) {}
  document.getElementById('prompt-input').focus();
}

function showBootChooser() {
  document.getElementById('boot').style.display = 'block';
  document.getElementById('app').classList.remove('visible');
  document.getElementById('palette').style.display = 'none';
  var out = document.getElementById('boot-output');
  out.innerHTML =
    '<div class="boot-line boot-chooser" id="boot-chooser">' +
      '<div class="chooser-head">[ <span class="hl">INCOMING</span> ] you\'ve caught a system mid-boot.</div>' +
      '<div class="chooser-opt" data-action="play"><span class="chooser-key">enter</span>let the sequence play</div>' +
      '<div class="chooser-opt" data-action="skip"><span class="chooser-key">esc</span>cut to the terminal</div>' +
      '<div class="chooser-prompt">&gt;<span class="prompt-hint">tap or press</span><span class="cursor"></span></div>' +
    '</div>';
  window.scrollTo(0, 0);

  function dispatch(action) {
    document.removeEventListener('keydown', onKey);
    if (action === 'play') {
      out.innerHTML = '';
      startBoot();
    } else {
      skipBoot();
    }
  }

  function onKey(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      dispatch('play');
    } else if (e.key === 'Escape') {
      e.preventDefault();
      dispatch('skip');
    }
  }

  out.querySelectorAll('.chooser-opt').forEach(function(el) {
    el.addEventListener('click', function() {
      dispatch(el.dataset.action);
    });
  });
  document.addEventListener('keydown', onKey);
}

function printOutput(html, topAlign) {
  var div = document.createElement('div');
  div.innerHTML = html;
  document.getElementById('app-output').appendChild(div);

        document.getElementById('active-prompt').scrollIntoView({ behavior: 'instant', block: 'nearest' });
      }
    });
  });
}

    '<li>LinkedIn: <a href="https://www.linkedin.com/in/nathannwaeze/" target="_blank" rel="noopener">linkedin.com/in/nathannwaeze</a></li>' +

    '</div>'); },

  'reboot': function() {

    document.getElementById('palette').style.display = 'none';
    document.getElementById('app-output').innerHTML = '';
    try { localStorage.removeItem(BOOT_KEY); } catch(e) {}

// =================================================================
// DISPATCH
// =================================================================
function exec(rawInput) {
  var input = rawInput.trim();
  if (!input) return;

  history.unshift(input);
  historyIdx = -1;

  var echo = document.createElement('div');
  echo.className = 'boot-line';
  echo.innerHTML = renderPromptLine(input.replace(/</g,'&lt;').replace(/>/g,'&gt;'));
  document.getElementById('app-output').appendChild(echo);

  var key = input.toLowerCase();
  // Strip .service suffix — 'cat authentik-sso.service' → 'cat authentik-sso'
  if (key.startsWith('cat ')) key = key.replace(/\.service$/, '');
  // Treat open/less/view/show as cat for project slugs
  var openMatch = key.match(/^(?:open|less|view|show)\s+(.+)$/);
  if (openMatch) key = 'cat ' + openMatch[1];

  if (COMMANDS[key]) {
    COMMANDS[key]();
  } else if (key.startsWith('sudo ')) {
    COMMANDS['sudo']();
  } else if (key.startsWith('cat ')) {
    var tried = key.slice(4).trim();
    printOutput('<div class="output"><span class="fail">cat: ' + tried.replace(/</g,'&lt;') + ': No such file or directory</span>\n<span class="sub">Run <span class="accent">ls</span> to see available projects, or click a row in the list.</span></div>');
  } else {
    printOutput('<div class="output"><span class="fail">zsh: command not found: ' + key.replace(/</g,'&lt;') + '</span>\n<span class="sub">Type <span class="accent">?</span> for available commands.</span></div>');
  }
}

// =================================================================
// INPUT HANDLERS
// =================================================================
var promptInput = document.getElementById('prompt-input');

// Block cursor tracking — measures typed text width to position the cursor span
var _cursorMeasurer = null;
function updateInputCursor() {
  var cursor = document.getElementById('input-cursor');
  if (!cursor) return;
  var input = document.getElementById('prompt-input');
  if (!_cursorMeasurer) {
    _cursorMeasurer = document.createElement('span');
    _cursorMeasurer.style.cssText =
      'position:fixed;top:-9999px;left:-9999px;visibility:hidden;white-space:pre;';
    document.body.appendChild(_cursorMeasurer);
  }
  var cs = window.getComputedStyle(input);
  _cursorMeasurer.style.fontFamily  = cs.fontFamily;
  _cursorMeasurer.style.fontSize    = cs.fontSize;
  _cursorMeasurer.style.fontWeight  = cs.fontWeight;
  _cursorMeasurer.style.letterSpacing = cs.letterSpacing;
  var pos = typeof input.selectionStart === 'number' ? input.selectionStart : input.value.length;
  _cursorMeasurer.textContent = input.value.slice(0, pos);
  cursor.style.left = _cursorMeasurer.offsetWidth + 'px';
}

promptInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var val = this.value;
    this.value = '';
    ensureAudio();
    exec(val);
    requestAnimationFrame(updateInputCursor);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (historyIdx < history.length - 1) { historyIdx++; this.value = history[historyIdx]; }
    requestAnimationFrame(updateInputCursor);
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (historyIdx > 0) { historyIdx--; this.value = history[historyIdx]; }
    else { historyIdx = -1; this.value = ''; }
    requestAnimationFrame(updateInputCursor);
  } else {
    keyClack();
    requestAnimationFrame(updateInputCursor);
  }
});

promptInput.addEventListener('input',  updateInputCursor);
promptInput.addEventListener('click',  updateInputCursor);
promptInput.addEventListener('focus',  updateInputCursor);

document.querySelectorAll('.chip[data-cmd]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    ensureAudio();
    exec(this.dataset.cmd);
    promptInput.focus();
  });
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && document.getElementById('boot').style.display !== 'none') {
    skipBoot();
  }
});

// sc-row click — run the associated cat command
document.getElementById('app-output').addEventListener('click', function(e) {
  var row = e.target.closest('.sc-row[data-cmd]');
  if (row) {
    ensureAudio();
    exec(row.dataset.cmd);
    promptInput.focus();
  }
});

document.addEventListener('click', function(e) {
  if (document.getElementById('app').classList.contains('visible')) {
    if (!e.target.closest('a, button, input, textarea')) {
      promptInput.focus();
    }
  }
});

// =================================================================
// INIT
// =================================================================
try {
  if (localStorage.getItem(BOOT_KEY)) {
    skipBoot();
  } else {
    showBootChooser();
  }
} catch(e) {
  showBootChooser();
}
</script>
